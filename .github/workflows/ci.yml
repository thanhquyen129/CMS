name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lcms
          POSTGRES_USER: lcms
          POSTGRES_PASSWORD: lcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcms -d lcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Cms.sln
      - name: Build
        run: dotnet build Cms.sln -c Release --no-restore
      - name: Test
        run: dotnet test Cms.sln -c Release --no-build --verbosity normal
      - name: Health smoke (local + Postgres)
        env:
          ConnectionStrings__LcmsDb: "Host=localhost;Port=5432;Database=lcms;Username=lcms;Password=lcms"
          Database__MigrateOnStartup: "true"
        run: |
          dotnet run --project src/LCMS.Api/LCMS.Api.csproj -c Release --urls http://127.0.0.1:5088 &
          sleep 8
          curl -fsS http://127.0.0.1:5088/health
          curl -fsS http://127.0.0.1:5088/ready

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy placeholder
        run: |
          echo "Deploy to cms-sg-01 /opt/cms after VPS clear + self-hosted runner is wired."
          echo "See docs/ops/vps-bootstrap.md"
