worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Basic edge rate limit (not a full WAF — see 08-vps-selfhost-hardening).
    limit_req_zone $binary_remote_addr zone=cms_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=cms_conn:10m;

    # Docker embedded DNS — re-resolve after api/web recreate (avoid stale IP → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_user_agent $bad_bot {
        default 0;
        ~*(nikto|sqlmap|masscan|zgrab|nuclei) 1;
    }

    server {
        listen 80;
        server_name _;

        limit_req zone=cms_req burst=60 nodelay;
        limit_conn cms_conn 40;

        # Block common scanner UAs and Next.js middleware-bypass header (CVE-2025-29927 class).
        if ($bad_bot) { return 403; }
        if ($http_x_middleware_subrequest) { return 403; }

        location /api/ {
            set $cms_api api:8080;
            proxy_pass http://$cms_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header x-middleware-subrequest "";
        }

        location = /health {
            set $cms_api api:8080;
            proxy_pass http://$cms_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /ready {
            set $cms_api api:8080;
            proxy_pass http://$cms_api/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Metrics: local/allowlist only — not on the public internet.
        location = /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            set $cms_api api:8080;
            proxy_pass http://$cms_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            set $cms_web web:3000;
            proxy_pass http://$cms_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header x-middleware-subrequest "";
        }
    }
}
