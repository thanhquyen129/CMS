# HTTPS configuration for cms.lsslogistics.vn
server {
    listen 80;
    server_name cms.lsslogistics.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        set $cms_api api:8080;
        proxy_pass http://$cms_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        set $cms_api api:8080;
        proxy_pass http://$cms_api/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cms.lsslogistics.vn;

    ssl_certificate /etc/letsencrypt/live/cms.lsslogistics.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.lsslogistics.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    limit_req zone=cms_req burst=60 nodelay;
    limit_conn cms_conn 40;

    # Block common scanner UAs and Next.js middleware-bypass header (CVE-2025-29927 class).
    if ($bad_bot) { return 403; }
    if ($http_x_middleware_subrequest) { return 403; }

    location /api/ {
        set $cms_api api:8080;
        proxy_pass http://$cms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header x-middleware-subrequest "";
    }

    location = /health {
        set $cms_api api:8080;
        proxy_pass http://$cms_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        set $cms_api api:8080;
        proxy_pass http://$cms_api/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Metrics: local/allowlist only — not on the public internet.
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        set $cms_api api:8080;
        proxy_pass http://$cms_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $cms_web web:3000;
        proxy_pass http://$cms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header x-middleware-subrequest "";
    }
}
