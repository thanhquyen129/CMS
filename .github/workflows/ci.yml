name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lcms
          POSTGRES_USER: lcms
          POSTGRES_PASSWORD: lcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcms -d lcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Cms.sln
      - name: Build
        run: dotnet build Cms.sln -c Release --no-restore
      - name: Test
        run: dotnet test Cms.sln -c Release --no-build --verbosity normal
      - name: Health smoke (local + Postgres)
        env:
          ConnectionStrings__LcmsDb: "Host=localhost;Port=5432;Database=lcms;Username=lcms;Password=lcms"
          Database__MigrateOnStartup: "true"
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail
          # Fixed sleep races migrate+startup; poll until listen (curl exit 7 = not up yet).
          dotnet run --project src/LCMS.Api/LCMS.Api.csproj -c Release --no-build --urls http://127.0.0.1:5088 > /tmp/lcms-smoke.log 2>&1 &
          api_pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5088/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "::error::API process exited before /health. Log:"
              cat /tmp/lcms-smoke.log || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::/health not ready after 60s. Log:"
            cat /tmp/lcms-smoke.log || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:5088/health
          curl -fsS http://127.0.0.1:5088/ready

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy SSH key
        env:
          CMS_DEPLOY_SSH_KEY: ${{ secrets.CMS_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$CMS_DEPLOY_SSH_KEY" ]; then
            echo "::error::Missing secret CMS_DEPLOY_SSH_KEY. Add the private key for deploy@cms-sg-01. See docs/ops/github-actions.md"
            exit 1
          fi

      - name: Resolve deploy target
        env:
          CMS_DEPLOY_HOST: ${{ secrets.CMS_DEPLOY_HOST }}
        run: |
          echo "DEPLOY_HOST=${CMS_DEPLOY_HOST:-194.233.89.26}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=deploy" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=/opt/cms" >> "$GITHUB_ENV"

      - name: Setup SSH
        env:
          CMS_DEPLOY_SSH_KEY: ${{ secrets.CMS_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CMS_DEPLOY_SSH_KEY" > ~/.ssh/cms_deploy_key
          chmod 600 ~/.ssh/cms_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync release to /opt/cms (never overwrite infra/.env)
        run: |
          # CMS only — never a1logex / /opt/alogex
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'infra/.env' \
            --exclude 'hailybato.txt' \
            --exclude 'docs/hailybato.txt' \
            --exclude '.secrets/' \
            --exclude '**/bin/' \
            --exclude '**/obj/' \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/cms_deploy_key -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Compose up on host
        run: |
          ssh -i ~/.ssh/cms_deploy_key -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -euo pipefail
             cd /opt/cms
             if [ -f infra/.env ]; then
               docker compose -f infra/docker-compose.host.yml --env-file infra/.env up -d --build
             else
               docker compose -f infra/docker-compose.host.yml up -d --build
             fi'

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "http://${DEPLOY_HOST}/health" && curl -fsS "http://${DEPLOY_HOST}/ready"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health/ready check failed after deploy"
          exit 1
