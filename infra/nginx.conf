worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Docker embedded DNS — re-resolve after api/web recreate (avoid stale IP → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        location /api/ {
            set $cms_api api:8080;
            proxy_pass http://$cms_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            set $cms_api api:8080;
            proxy_pass http://$cms_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /ready {
            set $cms_api api:8080;
            proxy_pass http://$cms_api/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /metrics {
            set $cms_api api:8080;
            proxy_pass http://$cms_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            set $cms_web web:3000;
            proxy_pass http://$cms_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
