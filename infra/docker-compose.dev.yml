# Local Postgres for LCMS development (no API container).
services:
  db:
    image: postgres:16-alpine
    container_name: cms-db-dev
    environment:
      POSTGRES_DB: lcms_dev
      POSTGRES_USER: lcms
      POSTGRES_PASSWORD: lcms
    ports:
      - "5432:5432"
    volumes:
      - cms_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lcms -d lcms_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cms_pgdata_dev:
